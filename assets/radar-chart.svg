<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>

    <!-- Radar Area Gradient -->
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.45" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="skyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box with Glassmorphic Border -->
  <rect x="5" y="5" width="540" height="490" rx="16" fill="url(#bgGrad)" stroke="#0EA5E9" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="275" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">ENGINEERING CAPABILITIES MATRIX</text>
  <text x="275" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#14B8A6" text-anchor="middle" letter-spacing="0.5">Core Competencies &amp; Technical Proficiency</text>

  <!-- Concentric Grid Polygons (20%, 40%, 60%, 80%, 100%) -->
  <!-- R=150 -->
  <polygon points="275,100 405,175 405,325 275,400 145,325 145,175" fill="none" stroke="#0EA5E9" stroke-opacity="0.15" stroke-width="1" />
  <!-- R=120 -->
  <polygon points="275,130 379,190 379,310 275,370 171,310 171,190" fill="none" stroke="#0EA5E9" stroke-opacity="0.2" stroke-width="1" />
  <!-- R=90 -->
  <polygon points="275,160 353,205 353,295 275,340 197,295 197,205" fill="none" stroke="#0EA5E9" stroke-opacity="0.25" stroke-width="1" />
  <!-- R=60 -->
  <polygon points="275,190 327,220 327,280 275,310 223,280 223,220" fill="none" stroke="#0EA5E9" stroke-opacity="0.3" stroke-width="1" />
  <!-- R=30 -->
  <polygon points="275,220 301,235 301,265 275,280 249,265 249,235" fill="none" stroke="#0EA5E9" stroke-opacity="0.35" stroke-width="1" />

  <!-- Axis Lines -->
  <line x1="275" y1="250" x2="275" y2="100" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="275" y1="250" x2="405" y2="175" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="275" y1="250" x2="405" y2="325" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="275" y1="250" x2="275" y2="400" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="275" y1="250" x2="145" y2="325" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="275" y1="250" x2="145" y2="175" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Skill Data Polygon -->
  <polygon points="275,118 379,190 372.5,315 275,385 164.5,323.75 164.5,176.25"
           fill="url(#polyGrad)" stroke="#14B8A6" stroke-width="2.5" filter="url(#tealGlow)" />

  <!-- Data Point Glowing Markers & Labels -->
  <!-- 1. AI (88%) Top -->
  <circle cx="275" cy="118" r="5" fill="#14B8A6" stroke="#F8FAFC" stroke-width="1.5" filter="url(#tealGlow)" />
  <text x="275" y="86" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#0EA5E9" text-anchor="middle">AI / ML</text>
  <text x="275" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">88%</text>

  <!-- 2. System Design (80%) Top-Right -->
  <circle cx="379" cy="190" r="5" fill="#14B8A6" stroke="#F8FAFC" stroke-width="1.5" filter="url(#tealGlow)" />
  <text x="418" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#0EA5E9" text-anchor="start">System Design</text>
  <text x="418" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="start">80%</text>

  <!-- 3. DevOps (75%) Bottom-Right -->
  <circle cx="372.5" cy="315" r="5" fill="#14B8A6" stroke="#F8FAFC" stroke-width="1.5" filter="url(#tealGlow)" />
  <text x="415" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#0EA5E9" text-anchor="start">DevOps</text>
  <text x="415" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="start">75%</text>

  <!-- 4. Backend (90%) Bottom -->
  <circle cx="275" cy="385" r="5" fill="#14B8A6" stroke="#F8FAFC" stroke-width="1.5" filter="url(#tealGlow)" />
  <text x="275" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#0EA5E9" text-anchor="middle">Backend</text>
  <text x="275" y="435" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">90%</text>

  <!-- 5. Frontend (85%) Bottom-Left -->
  <circle cx="164.5" cy="323.75" r="5" fill="#14B8A6" stroke="#F8FAFC" stroke-width="1.5" filter="url(#tealGlow)" />
  <text x="130" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#0EA5E9" text-anchor="end">Frontend</text>
  <text x="130" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="end">85%</text>

  <!-- 6. Databases (85%) Top-Left -->
  <circle cx="164.5" cy="176.25" r="5" fill="#14B8A6" stroke="#F8FAFC" stroke-width="1.5" filter="url(#tealGlow)" />
  <text x="130" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#0EA5E9" text-anchor="end">Databases</text>
  <text x="130" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="end">85%</text>

  <!-- Center Core Node -->
  <circle cx="275" cy="250" r="4" fill="#0EA5E9" filter="url(#skyGlow)" />
</svg>
